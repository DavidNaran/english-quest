    body { font-family: Verdana, sans-serif; margin: 20px; background: #fbf5e9; color: #222; }
    h1 { font-size: 1.4rem; }
    .pass { color: #1f7a3a; } .fail { color: #b2443c; font-weight: 700; }
    li { margin: 3px 0; font-size: .9rem; }
    #summary { font-size: 1.2rem; font-weight: 700; padding: 10px; border: 3px solid; border-radius: 10px; display: inline-block; }

<body>
  <h1>Tests de English Quest</h1>
  <p>Se ejecutan solos al abrir esta página. No modifican el progreso guardado (usan un almacén en memoria).</p>
  <div id="summary">Ejecutando…</div>
  <div id="out"></div>
  <script>
    // Aislar los tests del progreso real
    try { var __k = 'eq.v1'; window.__saved = localStorage.getItem(__k); } catch (e) {}
  </script>
  <script src="../js/ui/dom.js"></script>
  <script>
    // Almacén en memoria para los tests
    (function () {
      var real = Storage.prototype.setItem;
      Storage.prototype.setItem = function (k, v) { if (k === 'eq.v1') return; return real.apply(this, arguments); };
      var realGet = Storage.prototype.getItem;
      Storage.prototype.getItem = function (k) { if (k === 'eq.v1') return null; return realGet.apply(this, arguments); };
    })();
  </script>
